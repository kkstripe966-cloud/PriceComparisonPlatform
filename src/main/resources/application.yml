price:
  # 比价相关配置
  compare:
    # 价格刷新间隔（分钟）
    refresh-interval: 30
    # 价格历史保留天数
    history-days: 30
    # 预警阈值配置
    warning:
      # 价格偏差超过30%触发严重警告
      severe-threshold: 30
      # 价格偏差超过15%触发一般警告
      general-threshold: 15
    # 平台配置
    platforms:
      meituan:
        name: 美团
        api-url: https://api.meituan.com/price
        enabled: true
      eleme:
        name: 饿了么
        api-url: https://api.ele.me/price
        enabled: true
      jd:
        name: 京东到家
        api-url: https://api.jd.com/price
        enabled: true